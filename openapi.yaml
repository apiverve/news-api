openapi: 3.0.4
info:
  title: World News
  description: >-
    World News is a global news API that reads about 275 outlet feeds in 29
    editions and 6 languages and merges them into stories: one entry per story
    however many outlets carry it, ranked by that coverage. Filter by 13 topics,
    by the country a story is about, by the edition it ran in, or by language.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/news:
    get:
      summary: World News
      description: Get the top or latest news stories, by topic, country or edition
      operationId: news
      parameters:
        - name: category
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only stories on this topic. A story is in every topic its headline
            and summary name, not only its feed's section.
          example: technology
        - name: country
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only stories about this country, from any outlet: an ISO 3166 code
            or English name, for example JP or Japan.
          example: JP
        - name: edition
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only stories run by outlets based in this country: what its press is
            covering, in the languages it writes in. See list=editions.
          example: GB
        - name: language
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only stories in this language. Defaults to English, or with edition
            to the languages that edition's press writes in. Stories are never
            translated.
          example: es
        - name: sort
          in: query
          schema:
            type: string
          required: false
          description: >-
            top ranks stories by how many outlets carry them, favouring the last
            12 hours; latest is newest first.
          example: top
        - name: q
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only stories whose headlines or summaries contain every word given,
            in any case.
          example: chips
        - name: since
          in: query
          schema:
            type: string
          required: false
          description: >-
            Only stories published at or after this date or date-time (ISO
            8601), for example 2026-10-01 or 2026-10-01T14:00:00Z.
          example: '2026-10-01'
        - name: limit
          in: query
          schema:
            type: integer
          required: false
          description: >-
            Maximum number of stories to return: up to 10 on the free plan, 50
            on paid plans.
          example: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  date: '2026-10-06'
                  category: technology
                  edition: null
                  languages:
                    - en
                  country: null
                  sort: top
                  lastUpdated: '2026-10-06T21:25:23.605Z'
                  articleCount: 3
                  articles:
                    - category: technology
                      website: Ars Technica
                      title: >-
                        Amazon kills Alexa’s ability to control Echo speakers'
                        AUX input
                      pubDate: '2026-10-06T17:03:16.000Z'
                      image: https://cdn.arstechnica.net/wp-content/uploads/2018/11/71I6oj6ZFBL._SL1000_-1000x648.jpg
                      description: >-
                        Amazon hasn't made an Echo with a 3.5mm port in six
                        years.
                      link: https://arstechnica.com/gadgets/2026/10/amazon-bricks-alexas-ability-to-control-echo-speakers-aux-input/
                      id: 1c4e377fb78ebbb0
                      categories:
                        - technology
                      countries: []
