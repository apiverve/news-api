                          link: https://www.theverge.com/tech/1006103/amazon-alexa-aux-voice-commands
                          pubDate: '2026-10-06T19:03:56.000Z'
                      sentiment: neutral
                      sentimentScore: -1
                    - category: technology
                      website: TechRadar
                      title: >-
                        ASOS hacked? Customers receive threatening notification
